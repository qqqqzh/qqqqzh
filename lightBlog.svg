<svg width="900" height="90" viewBox="0 0 900 90" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- 白色扫光渐变 -->
    <linearGradient id="shine" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="45%" stop-color="rgba(255,255,255,0)" />
      <stop offset="50%" stop-color="rgba(255,255,255,1)" />
      <stop offset="55%" stop-color="rgba(255,255,255,0)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />

      <animate
        attributeName="x1"
        from="-100%"
        to="100%"
        dur="6s"
        repeatCount="indefinite" />
      <animate
        attributeName="x2"
        from="0%"
        to="200%"
        dur="6s"
        repeatCount="indefinite" />
    </linearGradient>

    <mask id="shine-mask">
      <rect width="100%" height="100%" fill="url(#shine)" />
    </mask>
  </defs>

  <style>
    .base {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 22px;
      font-weight: 600;
      fill: #000000;
      letter-spacing: 0.6px;
    }
    .shine {
      fill: white;
      mask: url(#shine-mask);
    }
  </style>

  <!-- 黑色底字 -->
  <text x="40" y="55" class="base">
    https://obsidian-note-ruby.vercel.app/
  </text>

  <!-- 白色扫光 -->
  <text x="40" y="55" class="base shine">
    https://obsidian-note-ruby.vercel.app/
  </text>

</svg>
