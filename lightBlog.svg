<svg width="450" height="90" viewBox="0 0 450 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shine" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="45%" stop-color="rgba(255,255,255,0)" />
      <stop offset="50%" stop-color="rgba(255,255,255,1)" />
      <stop offset="55%" stop-color="rgba(255,255,255,0)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />

      <animate
        attributeName="x1"
        from="-100%"
        to="100%"
        dur="4s"
        repeatCount="indefinite" />
      <animate
        attributeName="x2"
        from="0%"
        to="200%"
        dur="4s"
        repeatCount="indefinite" />
    </linearGradient>

    <mask id="shine-mask">
      <rect width="100%" height="100%" fill="url(#shine)" />
    </mask>
  </defs>

  <style>
    .base {
      font-family: 'JetBrains Mono', 'Segoe UI', Roboto, monospace;
      font-size: 26px;
      font-weight: 700;
      fill: #000000;
      letter-spacing: 1px;
    }
    .shine {
      fill: #ffffff;
      mask: url(#shine-mask);
    }
  </style>

  <text x="30" y="55" class="base">
    https://JustQ.top/
  </text>

  <text x="30" y="55" class="base shine">
    https://JustQ.top/
  </text>
</svg>
